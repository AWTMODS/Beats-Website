<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('beats-theme-v1');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.classList.toggle('dark', t === 'dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <meta name="theme-color" content="#09090b" />
    <title>Beats — Free, ad-free music player for Android, Windows &amp; Linux</title>
    <meta name="description" content="Beats is a free, open-source, plugin-based music player built with Flutter & Rust. Your downloaded songs play fully offline — community plugins bring streaming, charts, search and recommendations into one queue. No ads. No tracking." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-background font-sans text-foreground antialiased selection:bg-brand-accent/20 selection:text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
